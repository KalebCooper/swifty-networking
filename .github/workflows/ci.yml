name: CI

# Every build lane here is deliberate. The Linux container proves HTTPCore stays portable off Apple
# platforms (the whole point of keeping URLSession out of it) and is cheap. The Android emulator runs
# the opt-in portable HTTP and WebSocket client suites, and is cheap too.
# The macOS lane compiles the package for iOS and runs the suite natively on macOS, and it costs money:
# see the CI cost policy in CLAUDE.md before adding jobs or pushing per-commit.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - { graph: default, traits: '' }
          - { graph: HTTPPortable, traits: HTTPPortable }
          - { graph: Logging, traits: Logging }
          - { graph: WebSocketPortable, traits: WebSocketPortable }
          - { graph: client-combined, traits: 'HTTPPortable,WebSocketPortable,Logging' }
          - { graph: WebSocketHummingbird, traits: WebSocketHummingbird }
          - { graph: server-client-combined, traits: 'WebSocketHummingbird,WebSocketPortable,HTTPPortable,Logging' }
    # Every job in this repository is bounded, so a hang fails the job instead of sitting for the
    # six-hour default. The ceiling is that job's slowest green run on `main` under its current
    # definition, rounded up to the next five minutes and then tripled. `Scripts/verify.sh` holds
    # the rule that every job has one.
    # Each graph has its own cold-build ceiling. Recalibrate from the first green hosted matrix run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The trait set is part of the key: a `.build` made with a different trait set is the same
      # manifest and the same pins but not the same graph, and restoring one would hand this run a
      # stale build.
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-traits-${{ matrix.graph }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-traits-${{ matrix.graph }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-traits-${{ matrix.graph }}-
      - name: Run tests
        env:
          PACKAGE_TRAITS: ${{ matrix.traits }}
        run: |
          if [ -z "$PACKAGE_TRAITS" ]; then
            swift test
          else
            swift test --traits "$PACKAGE_TRAITS"
          fi

  android:
    name: swift test (Android)
    # `ubuntu-24.04` rather than `ubuntu-latest`: the action below derives the swift.org host toolchain
    # URL from the runner's os-release id, and swift.org publishes no build for a newer Ubuntu, so a
    # runner-image bump would fail the download before anything was compiled.
    runs-on: ubuntu-24.04
    # The action bounds only the emulator boot, so a hung adb run is otherwise unbounded here.
    # Slowest green run 6m41s, cold.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The trait set is part of the key for the same reason it is on the Linux lane, and the
      # toolchain build is in the key because this file pins it: a bump below must not restore a
      # `.build` the old compiler wrote. `runner.os` is `Linux` here as well, so the platform is
      # spelled out or this lane would restore the Linux lane's graph. The cache restores before the
      # build and saves when the job ends. Keep the token here in step with `swift-version` below.
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-Android-swift-6.3.3-traits-HTTPPortable-WebSocketPortable-Logging-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-Android-swift-6.3.3-traits-HTTPPortable-WebSocketPortable-Logging-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-Android-swift-6.3.3-traits-HTTPPortable-WebSocketPortable-Logging-
      # One composite step does the whole lane: it installs the swift.org host toolchain and the Swift
      # SDK for Android, pinned by exact build to the same 6.3.3 the Linux container runs, prints
      # `swift --version` straight after the install, builds the package and its tests for the x86_64
      # emulator triple, pushes the test runner to an emulator, and runs the whole suite there,
      # unfiltered. Pinned by commit; the `actions/cache` and `android-emulator-runner` it calls inside
      # are the composite's own and cannot be pinned from here. HTTPPortable, WebSocketPortable and
      # Logging are enabled: this lane is configured to exercise both portable clients and their
      # loopback fixtures on Android. A green hosted run is still required before claiming WebSocket
      # execution there. The URLSession transport compiles out under
      # `#if canImport(Darwin)`, and its test target builds to an empty binary that still has to link.
      - name: Build and test on an Android emulator
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          swift-version: '6.3.3'
          swift-build-flags: --traits HTTPPortable,WebSocketPortable,Logging

  apple:
    name: Build (iOS) & Test (macOS)
    runs-on: macos-26
    # Trait-enabled fixtures add cold builds; recalibrate from the first green hosted run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      # Compiles the package and its test targets for the iOS Simulator SDK against a generic
      # destination, so the iOS build, tests included, is proven on every push without booting a
      # simulator. This is the only lane that compiles the package for iOS.
      - name: Build for iOS
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme swifty-networking-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions
      # Runs the whole suite natively on macOS. Swift Testing starts every test at once and each
      # suite's time limit counts from that start, so a destination that is still coming up when the
      # run begins charges its start-up to every test. The host has nothing to boot, which keeps the
      # limit measuring the tests. This is also the only lane that runs the URLSession transport's
      # suite; the Linux and Android lanes compile it out under `#if canImport(Darwin)`. It is the same
      # scheme and destination the Xcode MCP runs locally against `My Mac`.
      - name: Test on macOS
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme swifty-networking-Package \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions
      # The package scheme uses the default graph. These independent trait runs exercise the live
      # NIO client, the Hummingbird server, and their combined interoperability on the same paid host.
      - name: Test portable WebSocket client on macOS
        run: swift test --traits WebSocketPortable --scratch-path .build-ws-client
      - name: Test Hummingbird server on macOS
        run: swift test --traits WebSocketHummingbird --scratch-path .build-ws-server
      - name: Test combined WebSocket clients and server on macOS
        run: swift test --traits WebSocketHummingbird,WebSocketPortable,HTTPPortable,Logging --scratch-path .build-ws-combined

  lint:
    name: swift-format lint
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # Slowest green run 0m45s, most of it container startup.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show swift-format version
        run: swift format --version
      # Any finding fails the job.
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests
