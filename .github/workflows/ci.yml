name: CI

# Every build lane here is deliberate. The Linux container proves HTTPCore stays portable off Apple
# platforms (the whole point of keeping URLSession out of it) and is cheap. The Android emulator proves
# the same claim on Android, under the same two traits, and is cheap too.
# The macOS lane is the real target and costs money: see the CI cost policy in CLAUDE.md before adding
# jobs or pushing per-commit.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # Every job in this repository is bounded, so a hang fails the job instead of sitting for the
    # six-hour default. The ceiling is that job's slowest green run on `main` under its current
    # definition, rounded up to the next five minutes and then tripled. `Scripts/verify.sh` holds
    # the rule that every job has one.
    # Slowest green run 4m38s, and that run missed the cache, so it is the cold-build number.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The trait set is part of the key: a `.build` made with a different trait set is the same
      # manifest and the same pins but not the same graph, and restoring one would hand this run a
      # stale build.
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-traits-HTTPPortable-Logging-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-traits-HTTPPortable-Logging-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-traits-HTTPPortable-Logging-
      # Both traits are enabled here and nowhere else: this lane is the one that builds the
      # AsyncHTTPClient transport and runs its suite, and the one that builds `LoggingObserver` over
      # swift-log and runs its suite.
      - name: Run tests
        run: swift test --traits HTTPPortable,Logging
      # The same suite again under the package's default trait set, which enables neither, so what a
      # consumer who asks for no trait actually gets is compiled and run on every push: the
      # `HTTPPortable` product empty, `LoggingObserver` absent, and neither the SwiftNIO stack nor
      # swift-log fetched. It uses a scratch path of its own so the cached `.build` above stays the
      # graph its key names, and it runs second so the cache restore serves the run that reuses it.
      - name: Run tests with the default trait set
        run: swift test --scratch-path .build-default

  android:
    name: swift test (Android)
    # `ubuntu-24.04` rather than `ubuntu-latest`: the action below derives the swift.org host toolchain
    # URL from the runner's os-release id, and swift.org publishes no build for a newer Ubuntu, so a
    # runner-image bump would fail the download before anything was compiled.
    runs-on: ubuntu-24.04
    # The action bounds only the emulator boot, so a hung adb run is otherwise unbounded here.
    # Slowest green run 6m41s, cold.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The trait set is part of the key for the same reason it is on the Linux lane, and the
      # toolchain build is in the key because this file pins it: a bump below must not restore a
      # `.build` the old compiler wrote. `runner.os` is `Linux` here as well, so the platform is
      # spelled out or this lane would restore the Linux lane's graph. The cache restores before the
      # build and saves when the job ends. Keep the token here in step with `swift-version` below.
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-Android-swift-6.3.3-traits-HTTPPortable-Logging-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-Android-swift-6.3.3-traits-HTTPPortable-Logging-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-Android-swift-6.3.3-traits-HTTPPortable-Logging-
      # One composite step does the whole lane: it installs the swift.org host toolchain and the Swift
      # SDK for Android, pinned by exact build to the same 6.3.3 the Linux container runs, prints
      # `swift --version` straight after the install, builds the package and its tests for the x86_64
      # emulator triple, pushes the test runner to an emulator, and runs the whole suite there,
      # unfiltered. Pinned by commit; the `actions/cache` and `android-emulator-runner` it calls inside
      # are the composite's own and cannot be pinned from here. Both traits are on, matching the Linux
      # lane's first run: this is the lane that proves the AsyncHTTPClient transport, the SwiftNIO
      # stack beneath it, and the loopback server its suite answers from on Android, and builds
      # `LoggingObserver` over swift-log. The URLSession transport compiles out under
      # `#if canImport(Darwin)`, and its test target builds to an empty binary that still has to link.
      - name: Build and test on an Android emulator
        uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          swift-version: '6.3.3'
          swift-build-flags: --traits HTTPPortable,Logging

  apple:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26
    # Slowest green run 4m57s. This lane keeps no build cache, so every run is a cold one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      # Surfaces the runner's real device names so a runner-image bump that renames a simulator is
      # diagnosable from the log, not just a red X.
      - name: List available simulators
        run: xcrun simctl list devices available
      # The OS is pinned instead of `latest` so a runner-image Xcode bump moves the tested platform only
      # when someone edits this line, and it is pinned to the *lowest* runtime the image carries rather
      # than the newest, so the lane tests something close to the package's own iOS 26 floor instead of
      # only the newest simulator. The floor itself is 26.0, which the image carries no runtime for:
      # it had 26.2, 26.4, and 26.5 when this was pinned, so 26.2 is as low as this can currently go.
      # The step above prints what the runner actually has; read it before editing this line. This is
      # also the only lane that compiles the URLSession transport at all; the Linux lane compiles it
      # out under `#if canImport(Darwin)`.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme swifty-networking-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

  lint:
    name: swift-format lint
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # Slowest green run 0m45s, most of it container startup.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show swift-format version
        run: swift format --version
      # Any finding fails the job.
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests
